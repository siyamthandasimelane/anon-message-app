<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Message App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="landing-container">
        <div class="landing-content">
            <h1>Anonymous Messages</h1>
            <p>Share your thoughts anonymously</p>
            
            <div class="landing-buttons">
                <button class="btn btn-primary" onclick="goTo('send-message')">
                    ✉️ Send Anonymous Message
                </button>
                <button class="btn btn-secondary" onclick="goTo('signup')">
                    📝 Create Account
                </button>
                <button class="btn btn-success" onclick="goTo('login')">
                    🔓 Login
                </button>
            </div>
        </div>
    </div>

    <!-- Send Message Modal -->
    <div id="send-message-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeSendMessage()">&times;</span>
            <h2>Send Anonymous Message</h2>
            <form id="anonymous-form">
                <input type="text" id="recipient-username" placeholder="Recipient username" required>
                <textarea id="message-text" placeholder="Your message..." required></textarea>
                <input type="text" id="message-clue" placeholder="Optional clue (only used if you're signed in)">
                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-storage.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
    <script>
        function goTo(page) {
            if (page === 'send-message') {
                document.getElementById('send-message-modal').style.display = 'block';
            } else if (page === 'signup') {
                window.location.href = 'auth.html?mode=signup';
            } else if (page === 'login') {
                window.location.href = 'auth.html?mode=login';
            }
        }

        function closeSendMessage() {
            document.getElementById('send-message-modal').style.display = 'none';
        }

        // Handle anonymous message submission
        document.getElementById('anonymous-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const recipient = document.getElementById('recipient-username').value;
            const message = document.getElementById('message-text').value;
            const clue = document.getElementById('message-clue').value || null;
            
            try {
                const payload = {
                    from: 'Anonymous',
                    to: recipient,
                    text: message,
                    timestamp: new Date(),
                    read: false,
                    clue: null,
                    clueRevealed: false,
                    senderId: null
                };

                if (auth.currentUser) {
                    const userDoc = await db.collection('users').doc(auth.currentUser.uid).get();
                    payload.from = userDoc.data().username || auth.currentUser.email;
                    payload.senderId = auth.currentUser.uid;
                    if (clue) payload.clue = clue;
                }

                await db.collection('messages').add(payload);
                alert('Message sent successfully!');
                closeSendMessage();
                document.getElementById('anonymous-form').reset();
            } catch (error) {
                alert('Error sending message: ' + error.message);
            }
        });
    </script>
    <footer class="site-footer">@nnonymous messages || siyamThanda simeLnae - 2026</footer>
</body>
</html>
