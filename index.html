<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Message App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="landing-container">
        <div class="landing-content">
            <h1>Anonymous Messages</h1>
            <p>Share your thoughts anonymously</p>
            
            <div class="landing-buttons">
                <button class="btn btn-primary" onclick="goTo('send-message')">
                    ✉️ Send Anonymous Message
                </button>
                <button class="btn btn-secondary" onclick="goTo('signup')">
                    📝 Create Account
                </button>
                <button class="btn btn-success" onclick="goTo('login')">
                    🔓 Login
                </button>
            </div>
        </div>
    </div>

    <!-- Send Message Modal -->
    <div id="send-message-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeSendMessage()">&times;</span>
            <h2>Send Anonymous Message</h2>
            <form id="anonymous-form">
                <input type="text" id="recipient-code" placeholder="Recipient code (e.g. REF_ABC123)" required>
                <textarea id="message-text" placeholder="Your message..." required></textarea>
                <input type="text" id="message-clue" placeholder="Optional clue (only used if you're signed in)">
                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
        </div>
    </div>

    <!-- removed Firebase SDKs; backend API will handle authentication and data storage -->
    <script src="auth.js"></script>
    <script src="app.js"></script>
    <script>
        function goTo(page) {
            if (page === 'send-message') {
                document.getElementById('send-message-modal').style.display = 'block';
            } else if (page === 'signup') {
                window.location.href = 'auth.html?mode=signup';
            } else if (page === 'login') {
                window.location.href = 'auth.html?mode=login';
            }
        }

        function closeSendMessage() {
            document.getElementById('send-message-modal').style.display = 'none';
        }

        // Handle anonymous message submission
        document.getElementById('anonymous-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const sendBtn = e.target.querySelector('button[type="submit"]');
            sendBtn.disabled = true;
            sendBtn.textContent = 'Sending...';

            const recipientCode = document.getElementById('recipient-code').value.trim();
            const message = document.getElementById('message-text').value;
            const clue = document.getElementById('message-clue').value || null;

            try {
                // resolve recipient code by asking the server -- backend handles lookup
                let recipientUsername = recipientCode;
                try {
                    const resp = await fetch('/api/users/lookup?code=' + encodeURIComponent(recipientCode));
                    if (resp.ok) {
                        const info = await resp.json();
                        if (info && info.username) recipientUsername = info.username;
                    }
                } catch (err) {
                    console.warn('Could not resolve recipient code:', err.message || err);
                }

                const payload = {
                    to: recipientUsername,
                    text: message,
                    clue: clue || null
                };

                // if logged in we send token in header already via api helper on client
                await api('/api/messages', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                // After successful send, ask user if they want to send another
                const again = confirm('Message sent successfully. Do you want to send another message?');
                if (again) {
                    // reset form but keep modal open
                    document.getElementById('anonymous-form').reset();
                    document.getElementById('recipient-code').focus();
                } else {
                    // close modal
                    closeSendMessage();
                }

            } catch (error) {
                alert('Error sending message: ' + error.message);
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send Message';
            }
        });
    </script>
    <footer class="site-footer">@annonymous messagee || siyamThanda simeLane - 2026</footer>
</body>
</html>
