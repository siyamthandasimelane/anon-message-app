<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Signup - Anonymous Message App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-form-wrapper">
            <!-- Login Form -->
            <div id="login-form-container" class="form-container active">
                <h2>Login</h2>
                <form id="login-form">
                    <input type="email" id="login-email" placeholder="Email" required>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
                <p>Don't have an account? <a href="#" onclick="toggleForm()">Sign up</a></p>
                <a href="index.html" class="btn btn-secondary" style="display: block; text-align: center; margin-top: 10px;">Back to Home</a>
            </div>

            <!-- Signup Form -->
            <div id="signup-form-container" class="form-container">
                <h2>Create Account</h2>
                <form id="signup-form">
                    <input type="text" id="signup-username" placeholder="Username" required>
                    <input type="email" id="signup-email" placeholder="Email" required>
                    <input type="password" id="signup-password" placeholder="Password (min 6 chars)" required>
                    <input type="text" id="referral-code" placeholder="Referral Code (optional)">
                    <button type="submit" class="btn btn-primary">Create Account</button>
                </form>
                <p>Already have an account? <a href="#" onclick="toggleForm()">Login</a></p>
                <a href="index.html" class="btn btn-secondary" style="display: block; text-align: center; margin-top: 10px;">Back to Home</a>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-storage.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <footer class="site-footer">@nnonymous messages || siyamThanda simeLnae - 2026</footer>
</body>
</html>
